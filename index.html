<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<meta name="theme-color" content="#0f1115">
<style>
:root{
  --bg:#0f1115; --surface:#181b22; --surface2:#21252e; --line:#2c313c;
  --text:#e9ecf1; --muted:#8b93a3; --accent:#3d8bfd; --accent-ink:#fff;
  --good:#2fbf71; --good-bg:rgba(47,191,113,.14); --warn:#f0a43a; --bad:#ef5b5b; --pr:#f5c518;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f4f7; --surface:#fff; --surface2:#eef0f4; --line:#dde1e8;
    --text:#14171c; --muted:#677083; --accent:#2a6fe0; --good:#1f9d5b; --good-bg:rgba(31,157,91,.12); --pr:#c99700; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
@media (max-width:700px){input,select,textarea{font-size:16px}}
button{cursor:pointer}
.app{max-width:760px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:24px;margin:4px 0}
h2{font-size:17px;margin:20px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.block{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:default}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tpl{cursor:pointer;margin:0}
.tpl:hover{border-color:var(--accent)}
.tpl h3{margin:0 0 6px;font-size:16px}
.tpl ul{margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.tpl li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);vertical-align:middle}
.badge.ss{background:rgba(61,139,253,.15);color:var(--accent)}
.badge.pr{background:rgba(245,197,24,.18);color:var(--pr)}
.badge.up{background:var(--good-bg);color:var(--good)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:190px;background:none;border:0;padding:12px 4px;color:var(--muted);font-size:13px;font-weight:600}
nav.tabs button.on{color:var(--accent)}
/* active workout */
.ex-title{font-weight:700;color:var(--accent);font-size:16px}
.target{font-size:13px;color:var(--muted);margin:2px 0 8px}
table.sets{width:100%;border-collapse:collapse}
table.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:4px 2px;text-align:center}
table.sets td{padding:3px 2px;text-align:center}
table.sets tr.done td{background:var(--good-bg)}
table.sets tr.done td:first-child{border-radius:8px 0 0 8px}
table.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.setno{width:34px;font-weight:700;color:var(--muted);border:0;background:none;padding:6px 0}
.setno.w{color:var(--warn)}
.prev{font-size:13px;color:var(--muted);white-space:nowrap}
table.sets input{width:100%;max-width:74px;text-align:center;background:var(--surface2);border:1px solid transparent;border-radius:8px;padding:7px 2px}
table.sets input:focus{outline:none;border-color:var(--accent)}
table.sets input::placeholder{color:var(--muted);opacity:.7}
.check{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
tr.done .check{background:var(--good);border-color:var(--good);color:#fff}
.del{border:0;background:none;color:var(--muted);padding:4px}
.hint{font-size:12px;margin-top:6px}
.hint.up{color:var(--good)}
input.txt.exnote{padding:6px 9px;font-size:13px;margin-bottom:6px}
@media (max-width:700px){input.txt.exnote{font-size:16px}}
textarea,input.txt,select{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px}
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;background:var(--accent);color:#fff;border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:20}
.timer b{font-size:20px;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.timer button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:5px 9px}
.timer.over{background:var(--good)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
@media (min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:16px}
@media (min-width:600px){.modal{border-radius:16px}}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:hover{background:var(--surface2)}
.stat{background:var(--surface2);border-radius:10px;padding:10px;flex:1;min-width:120px}
.stat b{display:block;font-size:18px}
svg.chart{width:100%;height:180px;display:block}
svg.chart text{fill:var(--muted);font-size:10px}
.hist-ex{font-size:14px;margin:2px 0}
.tpl-edit-row{display:grid;grid-template-columns:1fr 54px 70px 60px 50px auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.tpl-edit-row input{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px;width:100%;text-align:center}
@media (max-width:520px){.tpl-edit-row{grid-template-columns:1fr 44px 60px 50px 40px auto;font-size:13px}}
.pill{display:inline-flex;gap:4px}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs"></nav>
<div id="timer-slot"></div>
<div id="modal-slot"></div>

<script>
'use strict';
/* ============ Data ============ */
const KEY = 'gymlog.v1';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

// [name, category, isCompound]
const LIB = [
  ['Bench Press (Barbell)','Chest',1],['Bench Press (Dumbbell)','Chest',1],['Incline Dumbbell Press','Chest',1],['Incline Bench Press (Barbell)','Chest',1],['Incline Bench Press (Smith Machine)','Chest',1],['Chest Fly','Chest',0],
  ['Machine Chest Press','Chest',1],['Dips','Chest',1],
  ['Pull-up','Back',1],['Lat Pulldown','Back',1],['Chest-Supported Row','Back',1],['Cable Row','Back',1],
  ['T-Bar Row','Back',1],['Single-Arm Cable Pulldown','Back',0],
  ['Seated Dumbbell Shoulder Press','Shoulders',1],['Machine Shoulder Press','Shoulders',1],
  ['Cable Lateral Raise','Shoulders',0],['Dumbbell Lateral Raise','Shoulders',0],['Reverse Pec Deck','Shoulders',0],['Face Pull','Shoulders',0],
  ['Incline Dumbbell Curl','Biceps',0],['Bayesian Cable Curl','Biceps',0],['EZ-Bar Curl','Biceps',0],['Hammer Curl','Biceps',0],['Cable Curl','Biceps',0],['Cable Hammer Curl','Biceps',0],
  ['Overhead Cable Triceps Extension','Triceps',0],['Rope Pushdown','Triceps',0],['Straight-Bar Pushdown','Triceps',0],['Close-Grip Bench Press','Triceps',1],
  ['Overhead Dumbbell Extension','Triceps',0],
  ['Back Squat','Legs',1],['Hack Squat','Legs',1],['Leg Press','Legs',1],['Romanian Deadlift','Legs',1],
  ['Bulgarian Split Squat','Legs',1],['Leg Extension','Legs',0],['Seated Leg Curl','Legs',0],['Lying Leg Curl','Legs',0],
  ['Hip Thrust','Legs',1],['45° Back Extension','Legs',0],['Standing Calf Raise','Calves',0],['Seated Calf Raise','Calves',0],
  ['Cable Crunch','Core',0],['Hanging Leg Raise','Core',0],
];
// [exercise, sets, reps, rir, superset group, note]
const PLAN = {
  'Upper A': [
    ['Bench Press (Barbell)',3,'5-8','1-2','',''],
    ['Lat Pulldown',3,'6-10','1','','Or pull-up (swap)'],
    ['Cable Row',3,'8-12','1','','Seated'],
    ['Chest Fly',2,'10-15','0','','Machine or cable'],
    ['Incline Dumbbell Curl',3,'8-12','0-1','A',''],
    ['Overhead Dumbbell Extension',3,'8-12','0-1','A',''],
    ['Cable Lateral Raise',2,'12-20','0','',''],
  ],
  'Lower A': [
    ['Leg Press',3,'6-10','1','','Main lift'],
    ['Romanian Deadlift',3,'6-10','2','','Or stiff-leg deadlift'],
    ['Seated Leg Curl',3,'10-15','0','',''],
    ['Leg Extension',3,'10-15','0','',''],
    ['Standing Calf Raise',3,'8-12','0','','Pause in the stretch'],
    ['Cable Crunch',2,'10-15','','','Or machine crunch'],
  ],
  'Upper B': [
    ['Incline Bench Press (Smith Machine)',3,'6-10','1-2','','Log plates only (no bar weight)'],
    ['Chest-Supported Row',3,'8-12','1','','Incline dumbbell row'],
    ['Single-Arm Cable Pulldown',2,'10-15','0','','Or close-grip pulldown'],
    ['Bayesian Cable Curl',3,'10-15','0-1','A','Arm behind you'],
    ['Straight-Bar Pushdown',3,'10-15','0-1','A',''],
    ['Dumbbell Lateral Raise',2,'12-20','0','','Or Y-raise'],
    ['Reverse Pec Deck',2,'12-20','0','',''],
  ],
  'Lower B': [
    ['Bulgarian Split Squat',3,'6-10','1','','Main lift. Short stride, upright torso. Log per-hand dumbbell weight'],
    ['Hack Squat',3,'8-12','1','',''],
    ['Seated Leg Curl',3,'10-15','0','','Lying if the machine is taken'],
    ['Leg Extension',2,'12-15','0','',''],
    ['Seated Calf Raise',3,'12-20','0','',''],
    ['Hanging Leg Raise',2,'10-15','','',''],
  ],
  'Arms': [
    ['Cable Curl',3,'6-10','1','A',''],
    ['Close-Grip Bench Press',3,'6-10','1','A','Or dips (swap)'],
    ['Cable Hammer Curl',2,'10-15','0','B','Rope'],
    ['Overhead Cable Triceps Extension',2,'10-15','0','B',''],
    ['Cable Lateral Raise',3,'12-20','0','',''],
    ['Face Pull',2,'15-20','0','','Or reverse pec deck'],
  ],
};

// Built-in exercises and plan templates get fixed ids, so every device agrees on them when syncing
// Bump when the plan's exercise order changes; saved templates are updated once (history untouched)
const PLAN_V = 7;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const exIdFor = name => 'x-' + slug(name);
const tplIdFor = name => 't-' + slug(name);
function planTemplates(){
  return Object.entries(PLAN).map(([name, items]) => ({
    id: tplIdFor(name), name, planV: PLAN_V,
    items: items.map(([ex,sets,reps,rir,group,note]) => ({exId:exIdFor(ex), sets, reps, rir, group, note}))
  }));
}
function seed(){
  const exercises = LIB.map(([name,cat,c]) => ({id:exIdFor(name), name, cat, rest: c?150:90}));
  return {version:1, exercises, templates: planTemplates(), workouts:[], deleted:[], metaUpdated:0, active:null, settings:{unit:'kg', sound:true}};
}
// Older saves used random ids for built-in exercises/templates: switch them to the fixed ids
function migrate(){
  S.deleted = S.deleted || [];
  if(S.metaUpdated == null) S.metaUpdated = 0;
  S.workouts = S.workouts || [];
  S.bodyweight = S.bodyweight || [];
  const map = {};
  S.exercises.forEach(e => { if(LIB.some(l => l[0] === e.name)){ const nid = exIdFor(e.name); if(e.id !== nid){ map[e.id] = nid; e.id = nid; } } });
  const seen = new Set(); S.exercises = S.exercises.filter(e => !seen.has(e.id) && seen.add(e.id));
  const fix = it => { if(map[it.exId]) it.exId = map[it.exId]; };
  S.templates.forEach(t => { t.items.forEach(fix); if(PLAN[t.name] && !S.templates.some(o => o !== t && o.id === tplIdFor(t.name))) t.id = tplIdFor(t.name); });
  S.workouts.forEach(w => { w.exercises.forEach(fix); const t = S.templates.find(x => x.name === w.name); if(w.templateId && t && PLAN[w.name]) w.templateId = t.id; });
  if(S.active) S.active.exercises.forEach(fix);
  // New built-in exercises appear in older saves too
  LIB.forEach(([name, cat, c]) => { if(!S.exercises.some(e => e.id === exIdFor(name))) S.exercises.push({id:exIdFor(name), name, cat, rest: c?150:90}); });
  // When the plan changes, saved copies of the changed templates are replaced once (history untouched)
  const CHANGED = {2:['t-upper-a','t-upper-b'], 3:['t-upper-a','t-upper-b'], 4:['t-lower-a','t-lower-b'], 5:['t-upper-a','t-upper-b','t-arms']};
  S.templates.forEach(t => {
    const from = t.planV || 1;
    if(from >= PLAN_V) return;
    const planName = Object.keys(PLAN).find(k => tplIdFor(k) === t.id);
    const changed = Object.entries(CHANGED).some(([v, ids]) => +v > from && ids.includes(t.id));
    // v6: single exercise swap, keeps the rest of the template (and any edits) as is
    if(from < 6 && !changed && t.id === 't-lower-b') t.items.forEach(it => { if(it.exId === exIdFor('Lying Leg Curl')){ it.exId = exIdFor('Seated Leg Curl'); S.metaUpdated = Date.now(); } });
    // v7 (2026-10-24): Upper B incline barbell bench -> incline Smith press, edits kept
    if(from < 7 && !changed && t.id === 't-upper-b') t.items.forEach(it => { if(it.exId === exIdFor('Incline Bench Press (Barbell)')){ it.exId = exIdFor('Incline Bench Press (Smith Machine)'); it.note = 'Log plates only (no bar weight)'; S.metaUpdated = Date.now(); } });
    if(planName && changed){
      t.items = PLAN[planName].map(([ex,sets,reps,rir,group,note]) => ({exId:exIdFor(ex), sets, reps, rir, group, note}));
      S.metaUpdated = Date.now();
    }
    t.planV = PLAN_V;
  });
}

let S;
let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : seed();
  }catch(e){ storageOK = false; S = seed(); }
  if(!S.settings) S.settings = {unit:'kg', sound:true};
  migrate();
  lastMeta = metaSig(S);
}
// Templates, exercises and settings sync as one block: the most recently edited side wins
const metaSig = o => JSON.stringify([o.exercises, o.templates, o.settings]);
let lastMeta = '';
function save(fromSync){
  const m = metaSig(S);
  if(m !== lastMeta){ if(!fromSync) S.metaUpdated = Date.now(); lastMeta = m; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
  if(!fromSync && !S.active) scheduleSync();
}

/* ============ GitHub sync ============ */
const SKEY = 'gymlog.sync';
let SY = {};
try{ SY = JSON.parse(localStorage.getItem(SKEY) || '{}'); }catch(e){}
// Repo moved from marcin-sieradzki-g to marcin-sieradzki (2026-11-05)
if(SY.repo === 'marcin-sieradzki-g/gym-log') SY.repo = 'marcin-sieradzki/gym-log';
const saveSY = () => { try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} };
const syncOn = () => !!(SY.repo && SY.token);
let syncing = false, syncAgain = false, syncT = null;
function scheduleSync(ms = 2500){ if(!syncOn()) return; clearTimeout(syncT); syncT = setTimeout(syncNow, ms); }
function b64enc(str){ const b = new TextEncoder().encode(str); let s = ''; for(let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0))); }
function gh(method, body, raw){
  const path = (SY.path || 'data/gym-log.json').split('/').map(encodeURIComponent).join('/');
  return fetch(`https://api.github.com/repos/${SY.repo}/contents/${path}`, {
    method, cache: 'no-store',
    headers: {Authorization: `Bearer ${SY.token}`, Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', ...(body ? {'Content-Type':'application/json'} : {})},
    body: body ? JSON.stringify(body) : undefined
  });
}
async function ghError(r){
  if(r.status === 401) return 'GitHub rejected the token (wrong or expired).';
  if(r.status === 403) return "The token isn't allowed to write to this repo (needs Contents: Read and write).";
  if(r.status === 404) return "Repo not found, or the token doesn't have access to it.";
  let m = ''; try{ m = (await r.json()).message; }catch(e){}
  return `GitHub error ${r.status}${m ? ': ' + m : ''}`;
}
function mergeData(L, R){
  const deleted = [...new Set([...(L.deleted||[]), ...(R.deleted||[])])];
  const ws = new Map();
  const ver = w => w.updated || w.end || 0;
  [...(R.workouts||[]), ...(L.workouts||[])].forEach(w => { const o = ws.get(w.id); if(!o || ver(w) > ver(o)) ws.set(w.id, w); });
  const workouts = [...ws.values()].filter(w => !deleted.includes(w.id)).sort((a,b) => a.start - b.start);
  const newer = (R.metaUpdated||0) > (L.metaUpdated||0) ? R : L, older = newer === R ? L : R;
  const ex = new Map();
  [...(newer.exercises||[]), ...(older.exercises||[])].forEach(e => { if(!ex.has(e.id)) ex.set(e.id, e); });
  const bw = new Map();
  [...(R.bodyweight||[]), ...(L.bodyweight||[])].forEach(e => { const o = bw.get(e.date); if(!o || (e.updated||0) > (o.updated||0)) bw.set(e.date, e); });
  const bodyweight = [...bw.values()].sort((a,b) => a.date < b.date ? -1 : 1);
  return {...L, version:1, workouts, deleted, bodyweight, exercises:[...ex.values()], templates:newer.templates || L.templates,
    settings:newer.settings || L.settings, metaUpdated:Math.max(L.metaUpdated||0, R.metaUpdated||0), active:L.active};
}
const dataSig = o => JSON.stringify([(o.bodyweight||[]).map(e => e.date + ':' + (e.updated||0)),(o.workouts||[]).map(w => w.id + ':' + (w.updated || w.end || 0)).sort(), (o.deleted||[]).slice().sort(), o.metaUpdated||0, o.exercises, o.templates, o.settings]);
async function syncNow(){
  if(!syncOn()) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true; SY.state = 'busy'; drawSync();
  try{
    for(let attempt = 0; ; attempt++){
      let remote = null, sha;
      const r = await gh('GET');
      if(r.ok){
        const j = await r.json(); sha = j.sha;
        const txt = j.content ? b64dec(j.content) : await (await gh('GET', null, true)).text();
        remote = JSON.parse(txt);
      } else if(r.status !== 404) throw new Error(await ghError(r));
      if(remote){
        const before = dataSig(S);
        S = mergeData(S, remote); migrate(); save(true);
        if(dataSig(S) !== before) refreshView();
        if(dataSig(remote) === dataSig(S)) break; // already up to date
      }
      const p = await gh('PUT', {message: `Sync from ${navigator.platform || 'device'} ${new Date().toISOString().slice(0,16)}`,
        content: b64enc(JSON.stringify({...S, active:null})), ...(sha ? {sha} : {})});
      if(p.ok) break;
      if((p.status === 409 || p.status === 422) && attempt < 3) continue; // another device saved first: merge again
      throw new Error(await ghError(p));
    }
    SY.last = Date.now(); SY.err = ''; SY.state = 'ok';
  }catch(e){
    SY.err = (e && e.message && !/fetch/i.test(e.message)) ? e.message : "Couldn't reach GitHub (offline?). Will retry.";
    SY.state = 'err';
  }
  saveSY(); syncing = false; drawSync();
  if(syncAgain){ syncAgain = false; scheduleSync(500); }
}
function syncLabel(){
  if(!syncOn()) return '';
  if(SY.state === 'busy') return '☁︎ Syncing…';
  if(SY.err) return '⚠️ ' + SY.err;
  if(SY.last){ const m = Math.round((Date.now() - SY.last)/60000); return `☁︎ Synced ${m < 1 ? 'just now' : m < 60 ? m + ' min ago' : new Date(SY.last).toLocaleString()}`; }
  return '☁︎ Not synced yet';
}
function drawSync(){ document.querySelectorAll('[data-sync-status]').forEach(el => { el.textContent = syncLabel(); el.style.color = SY.err ? 'var(--bad)' : ''; }); }
function refreshView(){
  const a = document.activeElement;
  if(a && a.matches && a.matches('input,textarea,select')) return; // don't disturb typing
  if(typeof render === 'function' && document.getElementById('app')) render();
}

load(); save(true);

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const exById = id => S.exercises.find(e => e.id === id) || {name:'(deleted exercise)', cat:'', rest:90};
const fmtW = w => (w === '' || w == null) ? '' : (+(+w).toFixed(2)).toString();
const e1rm = (w, r) => (!w || !r) ? 0 : (r === 1 ? +w : +w * (1 + r / 30));
const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const fmtDur = ms => { const m = Math.round(ms/60000); return m >= 60 ? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; };
const repTop = reps => { const m = String(reps||'').match(/(\d+)\s*[-–]\s*(\d+)/); return m ? +m[2] : (parseInt(reps)||0); };
const repLow = reps => { const m = String(reps||'').match(/(\d+)/); return m ? +m[1] : 0; };
const done = w => S.workouts.filter(x => x.end).sort((a,b) => b.start - a.start);

// Last finished session containing an exercise
function lastSession(exId, beforeTs = Infinity){
  for(const w of done()){
    if(w.start >= beforeTs) continue;
    const e = w.exercises.find(x => x.exId === exId && x.sets.some(s => s.done));
    if(e) return {w, e};
  }
  return null;
}
// All completed working sets of an exercise, with dates
function historyOf(exId){
  const out = [];
  for(const w of done()){
    w.exercises.filter(x => x.exId === exId).forEach(e => {
      const sets = e.sets.filter(s => s.done && s.type !== 'w');
      if(sets.length) out.push({w, e, sets});
    });
  }
  return out; // newest first
}
function records(exId, beforeTs = Infinity){
  let maxW = 0, maxE = 0, maxVol = 0, maxReps = 0, best = null;
  for(const h of historyOf(exId)){
    if(h.w.start >= beforeTs) continue;
    let vol = 0;
    for(const s of h.sets){
      const w = +s.w || 0, r = +s.r || 0;
      vol += w * r;
      if(w > maxW) maxW = w;
      if(r > maxReps) maxReps = r;
      const e = e1rm(w, r);
      if(e > maxE){ maxE = e; best = s; }
    }
    if(vol > maxVol) maxVol = vol;
  }
  return {maxW, maxE, maxVol, maxReps, best};
}

/* ============ Router ============ */
let view = {name:'workout'};
function go(name, extra = {}){ view = {name, ...extra}; render(); window.scrollTo(0,0); }

function renderTabs(){
  const t = [['workout', S.active ? 'Workout •' : 'Workout'], ['history','History'], ['weight','Weight'], ['exercises','Exercises'], ['settings','Settings']];
  $('#tabs').innerHTML = t.map(([k,l]) => `<button data-tab="${k}" class="${view.name===k || (k==='exercises' && view.name==='exercise') ? 'on':''}">${l}</button>`).join('');
}
function render(){
  renderTabs();
  const v = view.name;
  let html = '';
  if(v === 'workout') html = S.active ? viewActive() : viewStart();
  else if(v === 'history') html = viewHistory();
  else if(v === 'session') html = viewSession(view.id);
  else if(v === 'exercises') html = viewExercises();
  else if(v === 'exercise') html = viewExercise(view.id);
  else if(v === 'template') html = viewTemplate(view.id);
  else if(v === 'settings') html = viewSettings();
  else if(v === 'weight') html = viewWeight();
  $('#app').innerHTML = (storageOK ? '' : `<div class="card" style="border-color:var(--bad)">⚠️ This browser is blocking local storage, so workouts won't be kept. Open the file in Safari or Chrome, or use Export often.</div>`) + html;
  if(v === 'workout' && S.active) tickClock();
  drawSync();
}

  <div class="tpl-grid">
    ${S.templates.map(t => `
      <div class="card tpl" data-start="${t.id}" ${next && t.id===next.id && last ? 'style="border-color:var(--accent)"':''}>
        <div class="row between"><h3>${esc(t.name)}</h3><button class="btn ghost small" data-edit-tpl="${t.id}">Edit</button></div>
        <ul>${t.items.map(it => `<li>${it.sets} × ${esc(exById(it.exId).name)}${it.group ? ` <span class="badge ss">SS ${esc(it.group)}</span>`:''}</li>`).join('')}</ul>
      </div>`).join('')}

    <button class="btn" data-act="new-tpl">New template</button>

}

function startWorkout(tplId){
  const t = S.templates.find(x => x.id === tplId);
  const w = {id:uid(), name: t ? t.name : 'Workout', templateId: t ? t.id : null, start: Date.now(), end:null, notes:'', exercises:[]};
  if(t) t.items.forEach(it => w.exercises.push(newWorkoutEx(it.exId, it)));
  S.active = w; save(); go('workout');
}
function newWorkoutEx(exId, it = null){
  const prev = lastSession(exId);
  const n = it ? it.sets : (prev ? prev.e.sets.filter(s=>s.type!=='w').length : 3) || 3;
  const sets = [];
  for(let i = 0; i < n; i++) sets.push({w:'', r:'', rir:'', done:false, type:'n'});
  return {id:uid(), exId, reps: it?.reps || '', rir: it?.rir || '', group: it?.group || '', note: it?.note || '', sets};
}

/* ============ Active workout ============ */
function prevSetsFor(we){
  const p = lastSession(we.exId, S.active.start);
  if(!p) return {normal:[], warm:[]};
  return {normal: p.e.sets.filter(s => s.done && s.type !== 'w'), warm: p.e.sets.filter(s => s.done && s.type === 'w')};
}
function progressionHint(we){
  const p = lastSession(we.exId, S.active.start);
  if(!p || !we.reps) return '';
  const sets = p.e.sets.filter(s => s.done && s.type !== 'w');
  if(!sets.length) return '';
  const top = repTop(we.reps), low = repLow(we.reps);
  const w0 = Math.max(...sets.map(s => +s.w || 0));
  if(top && sets.length >= we.sets.filter(s=>s.type!=='w').length && sets.every(s => +s.r >= top))
    return `<div class="hint up">↑ Last time you hit ${top}+ reps on every set. Add the smallest weight jump today.</div>`;
  if(low && sets.some(s => +s.r < low))
    return `<div class="hint muted">Last time some sets fell under ${low} reps. Keep ${fmtW(w0)} ${S.settings.unit} and build reps.</div>`;
  return `<div class="hint muted">Same weight as last time, aim for +1 rep on a set.</div>`;
}
function viewActive(){
  const w = S.active;
  const total = w.exercises.reduce((a,e) => a + e.sets.length, 0);
  const finished = w.exercises.reduce((a,e) => a + e.sets.filter(s=>s.done).length, 0);
  return `
  <header class="top">
    <div style="flex:1;min-width:0">
      <input class="txt" data-wname value="${esc(w.name)}" style="font-size:20px;font-weight:700;background:none;border:0;padding:0">
      <div class="muted small"><span id="clock"></span> · ${finished}/${total} sets</div>
    </div>
    <button class="btn primary" data-act="finish">Finish</button>
  </header>
  ${w.exercises.map((we, i) => exCard(we, i)).join('')}
  <button class="btn block" data-act="add-ex" style="margin-bottom:10px">+ Add exercise</button>
  <label class="small muted" style="font-weight:600">Session comment</label>
  <textarea data-wnotes rows="3" placeholder="Sick? Injury or pain? Bad sleep, low energy, short on time? Anything your coach should know.">${esc(w.notes)}</textarea>
  <button class="btn block danger" data-act="cancel" style="margin-top:12px">Discard workout</button>`;
}
function exCard(we, i){
  const ex = exById(we.exId);
  const prev = prevSetsFor(we);
  let ni = 0, wi = 0;
  const rows = we.sets.map((s, si) => {
    const isW = s.type === 'w';
    const p = isW ? prev.warm[wi++] : prev.normal[ni++];
    const label = isW ? 'W' : (we.sets.slice(0, si + 1).filter(x => x.type !== 'w').length);
    const prevTxt = p ? `${fmtW(p.w)}${p.w!==''?' × ':''}${p.r}${p.rir!==''&&p.rir!=null?` @${p.rir}`:''}` : '—';
    return `<tr class="${s.done?'done':''}" data-ex="${i}" data-set="${si}">
      <td><button class="setno ${isW?'w':''}" data-act="toggle-type" title="Tap to switch warm-up / working set">${label}</button></td>
      <td class="prev">${esc(prevTxt)}</td>
      <td><input inputmode="decimal" data-f="w" value="${esc(s.w)}" placeholder="${p?esc(fmtW(p.w)):''}"></td>
      <td><input inputmode="numeric" data-f="r" value="${esc(s.r)}" placeholder="${p?esc(p.r):''}"></td>
      <td><input inputmode="numeric" data-f="rir" value="${esc(s.rir)}" placeholder="${isW?'':esc(we.rir.split('-').pop()||'')}"></td>
      <td><button class="check" data-act="check">✓</button></td>
      <td><button class="del" data-act="del-set" title="Delete set">✕</button></td>
    </tr>`;
  }).join('');
  const target = [we.sets.filter(s=>s.type!=='w').length + ' sets', we.reps && `${we.reps} reps`, we.rir && `@ ${we.rir} RIR`].filter(Boolean).join(' × ').replace(' × @', ' @');
  return `<div class="card">
    <div class="row between">
      <div style="min-width:0">
        <span class="ex-title" data-open-ex="${we.exId}" style="cursor:pointer">${esc(ex.name)}</span>
        ${we.group ? ` <span class="badge ss">Superset ${esc(we.group)}</span>`:''}
      </div>
      <div class="pill">
        <button class="btn ghost small" data-act="reorder" title="Change exercise order">Move</button>
        <button class="btn ghost small" data-act="swap" data-ex="${i}">Swap</button>
        <button class="btn ghost small danger" data-act="del-ex" data-ex="${i}">Remove</button>
      </div>
    </div>
    <div class="target">${esc(target)}${we.note ? ` · ${esc(we.note)}`:''}</div>
    ${(() => { const lp = lastSession(we.exId, S.active.start); return lp && lp.e.myNote ? `<div class="small muted" style="margin:-4px 0 6px">Last note: ${esc(lp.e.myNote)}</div>` : ''; })()}
    <input class="txt exnote" data-exnote="${i}" value="${esc(we.myNote || '')}" placeholder="My note (seat 4, elbow twinge, felt easy…)">
    <table class="sets">
      <thead><tr><th>Set</th><th>Previous</th><th>${S.settings.unit}</th><th>Reps</th><th>RIR</th><th></th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="row between" style="margin-top:6px">
      <button class="btn ghost" data-act="add-set" data-ex="${i}">+ Add set</button>
      <button class="btn ghost small" data-act="add-warm" data-ex="${i}">+ Warm-up</button>
    </div>
    ${progressionHint(we)}
  </div>`;
}

let clockT = null;
function tickClock(){
  clearInterval(clockT);
  const f = () => { const el = $('#clock'); if(!el || !S.active){ clearInterval(clockT); return; } el.textContent = fmtClock(Date.now() - S.active.start); };
  f(); clockT = setInterval(f, 1000);
}
const fmtClock = ms => { const s = Math.floor(ms/1000); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h?h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0'); };

/* ---- Rest timer ---- */
let rest = null; // {end, total, t}
function startRest(sec){
  stopRest();
  rest = {end: Date.now() + sec*1000, beeped:false};
  rest.t = setInterval(drawRest, 250); drawRest();
}
function stopRest(){ if(rest){ clearInterval(rest.t); rest = null; } $('#timer-slot').innerHTML = ''; }
function drawRest(){
  if(!rest) return;
  const left = Math.round((rest.end - Date.now())/1000);
  if(left <= 0 && !rest.beeped){ rest.beeped = true; beep(); }
  if(left < -30){ stopRest(); return; }
  const t = Math.abs(left);
  $('#timer-slot').innerHTML = `<div class="timer ${left<=0?'over':''}">
    <span class="small">${left<=0?'Rest done':'Rest'}</span><b>${left<0?'+':''}${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</b>
    <button data-act="rest-add" data-v="-15">−15</button><button data-act="rest-add" data-v="15">+15</button><button data-act="rest-skip">Skip</button></div>`;
}
function beep(){
  if(!S.settings.sound) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(d => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + d); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + d + .18); o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + .2); });
  }catch(e){}
}

/* ---- Finish ---- */
function finishWorkout(){
  const w = S.active;
  // drop unfinished sets; drop exercises with no finished sets
  const pending = w.exercises.reduce((a,e) => a + e.sets.filter(s => !s.done).length, 0);
  if(pending && !confirm(`${pending} set(s) aren't ticked. They'll be dropped. Finish anyway?`)) return;
  // Compute PRs against history before this workout
  const prs = [];
  w.exercises.forEach(e => {
    const sets = e.sets.filter(s => s.done && s.type !== 'w');
    if(!sets.length) return;
    const r = records(e.exId, w.start);
    if(!historyOf(e.exId).some(h => h.w.start < w.start)) return; // first time, no PR noise
    const maxW = Math.max(...sets.map(s => +s.w || 0));
    const bestE = Math.max(...sets.map(s => e1rm(+s.w, +s.r)));
    const vol = sets.reduce((a,s) => a + (+s.w||0)*(+s.r||0), 0);
    const name = exById(e.exId).name;
    if(maxW > r.maxW) prs.push(`${name}: heaviest weight ${fmtW(maxW)} ${S.settings.unit}`);
    if(bestE > r.maxE + 0.01) prs.push(`${name}: best estimated 1RM ${bestE.toFixed(1)} ${S.settings.unit}`);
    if(vol > r.maxVol) prs.push(`${name}: most volume ${Math.round(vol)} ${S.settings.unit}`);
  });
  w.exercises.forEach(e => e.sets = e.sets.filter(s => s.done));
  w.exercises = w.exercises.filter(e => e.sets.length);
  w.end = Date.now();
  w.prs = prs;
  if(w.exercises.length) S.workouts.push(w);
  S.active = null; stopRest(); save(); scheduleSync(300);
  if(w.exercises.length){
    modal(`<h2 style="margin-top:0">Workout done 💪</h2>
      <p>${esc(w.name)} · ${fmtDur(w.end - w.start)} · ${w.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.type!=='w').length,0)} working sets</p>
      ${prs.length ? `<h2>New records</h2>${prs.map(p => `<div><span class="badge pr">PR</span> ${esc(p)}</div>`).join('')}` : `<p class="muted">No new records this time. Consistency is what counts.</p>`}
      <h2>Session comment</h2>
      <textarea data-session-notes="${w.id}" rows="3" placeholder="Sick? Injury or pain? Bad sleep, low energy, short on time? Anything your coach should know.">${esc(w.notes)}</textarea>
      <button class="btn primary block" data-act="close-modal" style="margin-top:14px">Done</button>`);
  }
  go('workout');
}

/* ============ History ============ */
function viewHistory(){
  const ws = done();
  if(!ws.length) return `<h1>History</h1><div class="empty">No workouts yet. Finish one and it shows up here.</div>`;
  // Weekly count
  const weekKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); };
  let html = `<h1>History</h1><p class="muted small">${ws.length} workouts logged</p>`;
  let cur = null;
  ws.forEach(w => {
    const k = weekKey(w.start);
    if(k !== cur){ cur = k; const n = ws.filter(x => weekKey(x.start) === k).length;
      html += `<h2>Week of ${new Date(k).toLocaleDateString(undefined,{day:'numeric',month:'short'})} <span class="muted small">· ${n} session${n>1?'s':''}</span></h2>`; }
    html += `<div class="card" data-session="${w.id}" style="cursor:pointer">
      <div class="row between"><b>${esc(w.name)}</b><span class="muted small">${fmtDate(w.start)} · ${fmtDur(w.end - w.start)}</span></div>
      ${w.exercises.map(e => { const ws_ = e.sets.filter(s=>s.type!=='w'); const best = ws_.reduce((b,s)=> e1rm(+s.w,+s.r) > e1rm(+b.w,+b.r) ? s : b, ws_[0]||{});
        return `<div class="hist-ex"><span class="muted">${ws_.length} ×</span> ${esc(exById(e.exId).name)} <span class="muted small">best ${fmtW(best.w)}${best.w!==''?' × ':''}${best.r??''}</span></div>`; }).join('')}
      ${w.notes ? `<div class="small muted" style="margin-top:6px">💬 ${esc(w.notes.length > 90 ? w.notes.slice(0,90) + '…' : w.notes)}</div>`:''}
      ${(w.prs||[]).length ? `<div style="margin-top:6px"><span class="badge pr">${w.prs.length} PR${w.prs.length>1?'s':''}</span></div>`:''}
    </div>`;
  });
  return html;
}
function viewSession(id){
  const w = S.workouts.find(x => x.id === id);
  if(!w) return `<div class="empty">Workout not found.</div>`;
  return `<header class="top"><button class="btn ghost" data-act="back-history">← History</button>
    <button class="btn danger" data-act="del-session" data-id="${w.id}">Delete</button></header>
  <h1>${esc(w.name)}</h1><p class="muted">${fmtDate(w.start)} · ${new Date(w.start).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${fmtDur(w.end - w.start)}</p>
  <div class="card"><label class="small muted" style="font-weight:600">Session comment</label>
    <textarea data-session-notes="${w.id}" rows="3" placeholder="Sick? Injury or pain? Bad sleep, low energy, short on time? Anything your coach should know.">${esc(w.notes)}</textarea></div>

    </tbody></table></div>`).join('')}`;

/* ============ Exercises ============ */
let exFilter = '';
function viewExercises(){
  const cats = [...new Set(S.exercises.map(e => e.cat))];
  const list = S.exercises.filter(e => e.name.toLowerCase().includes(exFilter.toLowerCase()));
  return `<header class="top"><h1>Exercises</h1><button class="btn" data-act="new-ex">+ New</button></header>
  <input class="txt" data-exfilter placeholder="Search" value="${esc(exFilter)}" style="margin-bottom:10px">
  <div id="exlist">${exListHtml(list, cats)}</div>`;
}
function exListHtml(list, cats){
  return cats.map(c => { const items = list.filter(e => e.cat === c).sort((a,b)=>a.name.localeCompare(b.name)); if(!items.length) return '';
    return `<h2>${esc(c)}</h2><div class="card" style="padding:4px 10px">${items.map(e => { const r = records(e.id); const n = historyOf(e.id).length;
      return `<div class="list-item" data-open-ex="${e.id}"><span>${esc(e.name)}</span><span class="muted small">${n ? `${n} session${n>1?'s':''} · best ${fmtW(r.best?.w)} × ${r.best?.r}` : ''}</span></div>`; }).join('')}</div>`; }).join('');
}
function viewExercise(id){
  const ex = exById(id);
  const hist = historyOf(id);
  const r = records(id);
  const pts = hist.slice().reverse().map(h => ({t: h.w.start, v: Math.max(...h.sets.map(s => e1rm(+s.w, +s.r)))})).filter(p => p.v > 0);
  // best reps at each weight
  const repPR = {};
  hist.forEach(h => h.sets.forEach(s => { const w = +s.w||0; if(!repPR[w] || +s.r > repPR[w].r) repPR[w] = {r:+s.r, t:h.w.start}; }));
  const repRows = Object.keys(repPR).map(Number).sort((a,b)=>b-a).slice(0,12);
  return `<header class="top"><button class="btn ghost" data-act="back-ex">← Exercises</button><button class="btn" data-act="edit-ex" data-id="${id}">Edit</button></header>
  <h1>${esc(ex.name)}</h1><p class="muted small">${esc(ex.cat)} · default rest ${Math.floor(ex.rest/60)}:${String(ex.rest%60).padStart(2,'0')}</p>
  ${hist.length ? `
  <div class="row wrap" style="gap:8px;margin-bottom:12px">
    <div class="stat"><span class="muted small">Best est. 1RM</span><b>${r.maxE.toFixed(1)} ${S.settings.unit}</b></div>
    <div class="stat"><span class="muted small">Heaviest weight</span><b>${fmtW(r.maxW)} ${S.settings.unit}</b></div>
    <div class="stat"><span class="muted small">Best set</span><b>${fmtW(r.best?.w)} × ${r.best?.r}</b></div>
    <div class="stat"><span class="muted small">Best session volume</span><b>${Math.round(r.maxVol)}</b></div>
  </div>
  <div class="card"><div class="muted small">Estimated 1RM per session</div>${chart(pts)}</div>
  <h2>Best reps at each weight</h2>
  <div class="card" style="padding:6px 12px">${repRows.map(w => `<div class="row between" style="padding:4px 0;border-bottom:1px solid var(--line)"><span>${fmtW(w)} ${S.settings.unit}</span><span><b>${repPR[w].r}</b> reps <span class="muted small">${new Date(repPR[w].t).toLocaleDateString()}</span></span></div>`).join('')}</div>
  <h2>History</h2>
  ${hist.map(h => `<div class="card"><div class="row between"><b>${esc(h.w.name)}</b><span class="muted small">${fmtDate(h.w.start)}</span></div>
    <div class="small">${h.sets.map(s => `${fmtW(s.w)} × ${s.r}${s.rir!==''&&s.rir!=null?` @${s.rir}`:''}`).join(' · ')}</div>${h.e.myNote ? `<div class="small muted">📝 ${esc(h.e.myNote)}</div>` : ''}</div>`).join('')}
  ` : `<div class="empty">No sets logged yet for this exercise.</div>`}`;
}
function chart(pts, what = 'sessions'){
  if(pts.length < 2) return `<div class="empty small">The chart appears after 2 ${what}.</div>`;
  const W = 600, H = 180, P = 28;
  const t0 = pts[0].t, t1 = pts[pts.length-1].t;
  let lo = Math.min(...pts.map(p=>p.v)), hi = Math.max(...pts.map(p=>p.v));
  const pad = Math.max(2, (hi-lo)*.15); lo -= pad; hi += pad;
  const x = t => P + (W-P-8) * (t1===t0 ? .5 : (t-t0)/(t1-t0));
  const y = v => H-20 - (H-30) * (v-lo)/(hi-lo);
  const d = pts.map((p,i) => `${i?'L':'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const grid = [lo+pad, (lo+hi)/2, hi-pad].map(v => `<line x1="${P}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v)+3}">${Math.round(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${pts.map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.5" fill="var(--accent)"><title>${new Date(p.t).toLocaleDateString()}: ${p.v.toFixed(1)}</title></circle>`).join('')}
    <text x="${P}" y="${H-4}">${new Date(t0).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>
    <text x="${W-8}" y="${H-4}" text-anchor="end">${new Date(t1).toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text></svg>`;
}

const isoDay = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const bwList = () => (S.bodyweight||[]).filter(e => e.kg != null && e.kg !== '').sort((a,b) => a.date < b.date ? -1 : 1);
function bwAvg(endDate, days){
  const end = new Date(endDate + 'T12:00:00'), start = new Date(end); start.setDate(start.getDate() - days + 1);
  const xs = bwList().filter(e => { const d = new Date(e.date + 'T12:00:00'); return d >= start && d <= end; }).map(e => +e.kg);
  return xs.length ? xs.reduce((a,b) => a+b, 0) / xs.length : null;
}

  <div class="row wrap" style="gap:8px;margin-bottom:12px">
    <div class="stat"><span class="muted small">7-day average</span><b>${a7 != null ? a7.toFixed(1) + ' ' + u : '—'}</b></div>
    <div class="stat"><span class="muted small">vs previous 7 days</span><b>${a7 != null && p7 != null ? (a7 - p7 >= 0 ? '+' : '') + (a7 - p7).toFixed(1) + ' ' + u : '—'}</b></div>
  </div>
  <div class="card"><div class="muted small">Daily weight</div>${chart(pts, 'entries')}</div>
  <h2>Entries</h2>
  <div class="card" style="padding:4px 12px">${list.slice().reverse().map(e => `<div class="row between" style="padding:6px 0;border-bottom:1px solid var(--line)">
    <span>${new Date(e.date + 'T12:00:00').toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'})}</span>
    <span><b>${esc(e.kg)}</b> ${u} <button class="del" data-act="bw-del" data-date="${e.date}" title="Delete">✕</button></span></div>`).join('')}</div>
  ` : `<div class="empty">No entries yet. Add today's weight above.</div>`}`;
}

function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let pickCb = null, pickFilter = '';

/* ============ Events ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab],[data-start],[data-edit-tpl],[data-open-ex],[data-session],[data-pick],[data-pick-new]');
  if(!t) return;
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.editTpl){ e.stopPropagation(); go('template', {id: t.dataset.editTpl}); return; }
  if(t.dataset.start){ if(S.active){ go('workout'); return; } startWorkout(t.dataset.start); return; }
  if(t.dataset.openEx){ closeModal(); go('exercise', {id: t.dataset.openEx}); return; }
  if(t.dataset.session){ go('session', {id: t.dataset.session}); return; }
  if(t.dataset.pick !== undefined && t.dataset.pick){ const cb = pickCb; closeModal(); cb && cb(t.dataset.pick); return; }
  if(t.hasAttribute('data-pick-new')){
    const ex = {id:uid(), name: pickFilter.trim(), cat:'Other', rest:90}; S.exercises.push(ex); save();
    const cb = pickCb; closeModal(); cb && cb(ex.id); return;
  }
  const a = t.dataset.act;
  const W = S.active;
  const row = t.closest('tr[data-ex]');
  const we = row ? W.exercises[+row.dataset.ex] : (t.dataset.ex !== undefined && W ? W.exercises[+t.dataset.ex] : null);
  switch(a){
    case 'empty-workout': startWorkout(null); break;
    case 'new-tpl': { const tpl = {id:uid(), name:'New template', items:[]}; S.templates.push(tpl); save(); go('template', {id: tpl.id}); break; }
    case 'finish': finishWorkout(); break;
    case 'cancel': if(confirm('Discard this workout? Nothing from it will be saved.')){ S.active = null; stopRest(); save(); go('workout'); } break;
    case 'add-ex': pickExercise(id => { W.exercises.push(newWorkoutEx(id)); save(); render(); }); break;
    case 'swap': pickExercise(id => { const old = we; const n = newWorkoutEx(id, {sets: old.sets.length, reps: old.reps, rir: old.rir, group: old.group, note:''}); W.exercises[+t.dataset.ex] = n; save(); render(); }, 'Swap for…'); break;
    case 'del-ex': if(!we.sets.some(s=>s.done) || confirm('Remove this exercise and its sets?')){ W.exercises.splice(+t.dataset.ex, 1); save(); render(); } break;
    case 'reorder': reorderModal(); break;
    case 'bw-save': { const d = $('#bw-date').value, kg = parseFloat(($('#bw-kg').value || '').replace(',', '.'));
      if(!d || !(kg > 20 && kg < 400)){ alert('Enter a weight, e.g. 93.2'); return; } setBw(d, +kg.toFixed(2)); break; }
    case 'bw-del': if(confirm('Delete this entry?')) setBw(t.dataset.date, null); break;
    case 'ro-up': case 'ro-down': case 'ro-next': {
      const i = +t.dataset.i, X = W.exercises;
      let j = a === 'ro-up' ? i - 1 : a === 'ro-down' ? i + 1 : X.findIndex(e => !e.sets.some(s => s.done));
      if(a === 'ro-next' && j > i) j = i;
      if(j < 0 || j >= X.length || j === i) break;
      const [m] = X.splice(i, 1); X.splice(j, 0, m); save(); reorderModal(); render(); break;
    }
    case 'move-up': { const i = +t.dataset.ex; if(i > 0){ [W.exercises[i-1], W.exercises[i]] = [W.exercises[i], W.exercises[i-1]]; save(); render(); } break; }
    case 'add-set': { const last = we.sets.filter(s=>s.type!=='w').slice(-1)[0]; we.sets.push({w:last?.w||'', r:'', rir:'', done:false, type:'n'}); save(); render(); break; }
    case 'add-warm': { const i = we.sets.findIndex(s => s.type !== 'w'); we.sets.splice(i < 0 ? we.sets.length : i, 0, {w:'', r:'', rir:'', done:false, type:'w'}); save(); render(); break; }
    case 'del-set': we.sets.splice(+row.dataset.set, 1); save(); render(); break;
    case 'toggle-type': { const s = we.sets[+row.dataset.set]; s.type = s.type === 'w' ? 'n' : 'w'; save(); render(); break; }
    case 'check': {
      const s = we.sets[+row.dataset.set];
      if(!s.done){
        // fill blanks from placeholders (= previous)
        row.querySelectorAll('input').forEach(inp => { if(inp.value === '' && inp.placeholder && inp.dataset.f !== 'rir') s[inp.dataset.f] = inp.placeholder; });
        if(s.r === '' ){ alert('Enter reps first.'); return; }
        s.done = true;
        if(s.type !== 'w') startRest(exById(we.exId).rest || 90);
      } else s.done = false;
      save(); render(); break;
    }
    case 'rest-add': if(rest){ rest.end += (+t.dataset.v)*1000; rest.beeped = false; drawRest(); } break;
    case 'rest-skip': stopRest(); break;
    case 'close-modal': closeModal(); break;
    case 'close-modal-bg': if(e.target === t) closeModal(); break;
    case 'back-history': go('history'); break;
    case 'back-ex': go('exercises'); break;
    case 'back-start': go('workout'); break;
    case 'del-session': if(confirm('Delete this workout from history?')){ S.workouts = S.workouts.filter(w => w.id !== t.dataset.id); S.deleted.push(t.dataset.id); save(); go('history'); } break;
    case 'new-ex': editExerciseModal(null); break;
    case 'edit-ex': editExerciseModal(t.dataset.id); break;
    case 'm-save-ex': {
      const name = $('#m-name').value.trim(); if(!name) return;
      const vals = {name, cat: $('#m-cat').value, rest: Math.max(0, parseInt($('#m-rest').value) || 90)};
      if(t.dataset.id) Object.assign(exById(t.dataset.id), vals); else S.exercises.push({id:uid(), ...vals});
      save(); closeModal(); render(); break;
    }
    case 'm-del-ex': S.exercises = S.exercises.filter(x => x.id !== t.dataset.id); S.templates.forEach(tp => tp.items = tp.items.filter(i => i.exId !== t.dataset.id)); save(); closeModal(); go('exercises'); break;
    case 'del-tpl': if(confirm('Delete this template? Your history stays.')){ S.templates = S.templates.filter(x => x.id !== t.dataset.id); save(); go('workout'); } break;
    case 'tpl-add': { const tp = S.templates.find(x => x.id === view.id); pickExercise(id => { tp.items.push({exId:id, sets:3, reps:'8-12', rir:'1', group:'', note:''}); save(); render(); }); break; }
    case 'tpl-del': case 'tpl-up': {
      const tp = S.templates.find(x => x.id === view.id); const i = +t.closest('[data-ti]').dataset.ti;
      if(a === 'tpl-del') tp.items.splice(i, 1); else if(i > 0) [tp.items[i-1], tp.items[i]] = [tp.items[i], tp.items[i-1]];
      save(); render(); break;
    }
    case 'export': download(`gym-log-backup-${today()}.json`, JSON.stringify({...S, active: S.active}, null, 1), 'application/json'); break;
    case 'export-csv': {
      const rows = [['date','workout','exercise','set','type','weight_'+S.settings.unit,'reps','rir','e1rm']];
      done().slice().reverse().forEach(w => w.exercises.forEach(e => { let n = 0; e.sets.forEach(s => rows.push([new Date(w.start).toISOString().slice(0,10), w.name, exById(e.exId).name, s.type==='w'?'W':++n, s.type==='w'?'warmup':'working', s.w, s.r, s.rir, s.type==='w'?'':e1rm(+s.w,+s.r).toFixed(1)])); }));
      download(`gym-log-sets-${today()}.csv`, rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? `"${String(c).replace(/"/g,'""')}"` : c).join(',')).join('\n'), 'text/csv'); break;
    }
    case 'reset-tpl': if(confirm('Replace your templates with the 5 plan workouts? History is kept.')){
      const fresh = seed();
      // keep existing exercise ids where names match
      fresh.exercises.forEach(fe => { if(!S.exercises.some(e => e.name === fe.name)) S.exercises.push(fe); });
      S.templates = planTemplates();
      save(); go('workout'); } break;
    case 'sy-save': {
      const repo = $('#sy-repo').value.trim().replace(/^https?:\/\/github\.com\//, '').replace(/\.git$|\/$/g, '');
      const token = $('#sy-token').value.trim();
      if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ alert('Repo should look like owner/name, e.g. marcin-sieradzki/gym-log'); return; }
      if(!token && !SY.token){ alert('Paste your GitHub token first.'); return; }
      SY.repo = repo; if(token) SY.token = token; SY.err = ''; SY.path = SY.path || 'data/gym-log.json'; saveSY(); render(); syncNow(); break;
    }
    case 'sy-now': syncNow(); break;
    case 'sy-off': if(confirm('Stop syncing on this device? Your data stays here and on GitHub.')){ SY = {}; saveSY(); render(); } break;
    case 'wipe': if(confirm('Erase ALL workouts, templates and exercises on this device? Export a backup first if unsure.' + (syncOn() ? ' (Your GitHub copy is kept; the next sync brings it back.)' : '')) && confirm('Really erase everything?')){ S = seed(); save(true); go('workout'); } break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.f){ const row = t.closest('tr[data-ex]'); S.active.exercises[+row.dataset.ex].sets[+row.dataset.set][t.dataset.f] = t.value.replace(',', '.'); save(); }
  else if(t.hasAttribute('data-wname')){ S.active.name = t.value; save(); }
  else if(t.hasAttribute('data-wnotes')){ S.active.notes = t.value; save(); }
  else if(t.dataset.exnote !== undefined){ S.active.exercises[+t.dataset.exnote].myNote = t.value; save(); }
  else if(t.dataset.sessionExnote){ const [wid, ei] = t.dataset.sessionExnote.split(':'); const w = S.workouts.find(x => x.id === wid);
    if(w && w.exercises[+ei]){ w.exercises[+ei].myNote = t.value; w.updated = Date.now(); save(); } }
  else if(t.dataset.sessionNotes){ const w = S.workouts.find(x => x.id === t.dataset.sessionNotes); if(w){ w.notes = t.value; w.updated = Date.now(); save(); } }
  else if(t.hasAttribute('data-tplname')){ S.templates.find(x => x.id === view.id).name = t.value; save(); }
  else if(t.dataset.tf){ const tp = S.templates.find(x => x.id === view.id); const it = tp.items[+t.closest('[data-ti]').dataset.ti];
    it[t.dataset.tf] = t.dataset.tf === 'sets' ? (parseInt(t.value) || 1) : (t.dataset.tf === 'group' ? t.value.toUpperCase() : t.value); save(); }
  else if(t.hasAttribute('data-exfilter')){ exFilter = t.value; const list = S.exercises.filter(x => x.name.toLowerCase().includes(exFilter.toLowerCase()));
    $('#exlist').innerHTML = exListHtml(list, [...new Set(S.exercises.map(x => x.cat))]); }
  else if(t.hasAttribute('data-pickfilter')){ pickFilter = t.value; $('#picklist').innerHTML = pickListHtml(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'bw-date'){ const x = bwList().find(b => b.date === t.value); $('#bw-kg').value = x ? x.kg : ''; }
  if(t.dataset.setting){ S.settings[t.dataset.setting] = t.type === 'checkbox' ? t.checked : t.value; save(); render(); }
  if(t.hasAttribute('data-import') && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try{ const d = JSON.parse(fr.result); if(!d.exercises || !d.workouts) throw 0;
        if(confirm(`Import backup with ${d.workouts.length} workouts? This replaces what's in the app now.`)){ S = d; migrate(); save(); scheduleSync(300); go('history'); } }
      catch(err){ alert("That file doesn't look like a Gym Log backup."); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeModal();
  if(e.key === 'Enter' && e.target.matches('[data-pickfilter]')){ const first = $('#picklist [data-pick],#picklist [data-pick-new]'); first && first.click(); }
  if(e.key === 'Enter' && e.target.id === 'bw-kg'){ $('[data-act=bw-save]').click(); }
  if(e.key === 'Enter' && e.target.dataset.f){ e.target.closest('tr').querySelector('[data-act=check]').click(); }
});
// Keep other tabs/windows in sync
window.addEventListener('storage', ev => { if(ev.key === KEY){ load(); render(); } });

render();
if(syncOn()) syncNow();
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && syncOn() && Date.now() - (SY.last||0) > 30000) syncNow(); });
window.addEventListener('online', () => scheduleSync(500));

// Phone/hosted extras: offline cache + ask the browser not to wipe our data
if(location.protocol.startsWith('http')){
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
</script>
</body>
</html>
